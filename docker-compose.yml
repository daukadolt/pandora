services:
  # ---------------------------------------------------------------------------
  # Apache Ignite — distributed state for warm pool and sandbox registry
  # ---------------------------------------------------------------------------
  ignite:
    image: apacheignite/ignite:2.16.0
    ports:
      - "10800:10800"   # thin client (pyignite connects here)
      - "8080:8080"     # REST API / Ignite Control Center
    environment:
      - IGNITE_QUIET=false
      - JVM_OPTS=-Xms512m -Xmx1g
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=pandora
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
