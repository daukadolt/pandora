[project]
name = "pandora"
version = "0.1.0"
description = "Ephemeral code execution inside Firecracker microVMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.129.0",
    "paramiko>=4.0.0",
    "prometheus-client>=0.24.1",
    "pyignite>=0.6.1",
    "requests>=2.32.5",
    "requests-unixsocket>=0.4.1",
    "uvicorn[standard]>=0.41.0",
]

[project.scripts]
pandora-server = "uvicorn:main"
