global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "pandora"
    # host.docker.internal resolves to the host machine from inside Docker.
    # Pandora's API server listens on 0.0.0.0:8000 inside Lima.
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
